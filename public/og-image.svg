<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#030303"/>

  <!-- Gradient blobs -->
  <circle cx="200" cy="100" r="300" fill="#f97316" fill-opacity="0.15" filter="blur(100px)"/>
  <circle cx="1000" cy="500" r="250" fill="#14b8a6" fill-opacity="0.15" filter="blur(100px)"/>

  <!-- Logo -->
  <rect x="50" y="50" width="60" height="60" rx="12" fill="url(#logoGrad)"/>
  <text x="80" y="90" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">AI</text>

  <!-- Main text -->
  <text x="600" y="250" font-family="system-ui, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">Build Your First</text>
  <text x="600" y="340" font-family="system-ui, sans-serif" font-size="72" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">AI Project</text>
  <text x="600" y="420" font-family="system-ui, sans-serif" font-size="48" fill="#a3a3a3" text-anchor="middle">in 60 Minutes</text>

  <!-- Badge -->
  <rect x="450" y="480" width="300" height="50" rx="25" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-opacity="0.5"/>
  <text x="600" y="515" font-family="system-ui, sans-serif" font-size="20" fill="#f97316" text-anchor="middle">FREE Workshop • 500 Seats</text>

  <!-- Bottom bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#barGrad)"/>

  <defs>
    <linearGradient id="logoGrad" x1="50" y1="50" x2="110" y2="110">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="300" y1="280" x2="900" y2="340">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
</svg>
